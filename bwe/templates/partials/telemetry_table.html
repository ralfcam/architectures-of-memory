<!-- bwe/templates/partials/telemetry_table.html -->
<div class="space-y-3">
  <div class="flex items-center justify-between border-b border-stone-800 pb-2">
    <span class="text-xs font-semibold uppercase tracking-wider text-stone-400">Citation Telemetry (ARC-58)</span>
    <span class="text-[11px] font-mono text-stone-500">{{ telemetry | length }} events</span>
  </div>
  <table class="w-full text-xs font-mono">
    <thead>
      <tr class="text-stone-400 border-b border-stone-800 text-left">
        <th class="py-1">Series</th>
        <th class="py-1">Chapter</th>
        <th class="py-1">Footnote</th>
        <th class="py-1">Time</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-stone-850 text-stone-300">
      {% for event in telemetry %}
      <tr>
        <td class="py-1 text-amber-400">{{ event.series_slug }}</td>
        <td class="py-1">{{ event.chapter_slug }}</td>
        <td class="py-1">[^{{ event.footnote_id }}]</td>
        <td class="py-1 text-stone-500">{{ event.created_at }}</td>
      </tr>
      {% else %}
      <tr>
        <td colspan="4" class="py-2 text-stone-500 italic">No telemetry recorded yet.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
