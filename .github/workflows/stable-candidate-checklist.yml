name: Stable-candidate five-rule comment

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  issues: write
  contents: read

jobs:
  checklist:
    if: >
      (
        github.event.action != 'labeled' &&
        (
          contains(github.event.issue.labels.*.name, 'stable-candidate') ||
          contains(github.event.issue.labels.*.name, 'extraction')
        )
      ) ||
      (
        github.event.action == 'labeled' &&
        (
          github.event.label.name == 'stable-candidate' ||
          github.event.label.name == 'extraction'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Extract card filename
        id: card
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re
          body = os.environ.get("BODY") or ""
          m = re.search(r"### Card filename\s+([^\n]+)", body)
          name = (m.group(1).strip() if m else "")
          name = name.strip("`").strip()
          if name and not name.endswith(".md"):
              name += ".md"
          if name and not re.fullmatch(r"[A-Za-z0-9._-]+\.md", name):
              name = ""
          print(f"name={name}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"name={name}\n")
          PY
      - name: Run mechanical five-rule check across series
        id: check
        if: steps.card.outputs.name != ''
        env:
          CARD_NAME: ${{ steps.card.outputs.name }}
        run: |
          match=$(find series -path "*/evidence-cards/${CARD_NAME}" -print -quit)
          if [ -n "$match" ] && [ -f "$match" ]; then
            python3 scripts/five_rule_check.py "$match" --online-retraction-check | tee /tmp/five-rule.txt
          else
            echo "Card file not found under series/**/evidence-cards/: ${CARD_NAME}" | tee /tmp/five-rule.txt
          fi
      - name: Comment (read-only; no promotion)
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          CARD_NAME: ${{ steps.card.outputs.name }}
        with:
          script: |
            const fs = require('fs');
            const card = process.env.CARD_NAME ?? '';
            let check = '_Card filename invalid or missing._';
            if (fs.existsSync('/tmp/five-rule.txt')) {
              check = fs.readFileSync('/tmp/five-rule.txt', 'utf8').trim();
            }
            const body = [
              '## Five-rule checklist (read-only)',
              '',
              'Automation **does not** set `status: stable` and **does not** open or merge a PR.',
              '',
              card ? `Card named in issue: \`${card}\`` : 'Card filename invalid or missing.',
              '',
              '```',
              check,
              '```',
              '',
              '| Rule | Verification Scope |',
              '|---|---|',
              '| (1) Resolvable sources | Verified against `SOURCES.md` and `sources.bib` |',
              '| (2) No retraction/EoC | Automated via Crossref `update-to` & OpenAlex `is_retracted` |',
              '| (3) Replication of the *narrow* claim | Human classification of independent/conceptual replication |',
              '| Design class / GI attenuation | State design and attenuation class (`>50%`, `20–50%`, `<20%`, `n/a`) |',
              '| (4) YAML = in-body grades | Script verifies exact grade token parity |',
              '| (5) Substantive WTDM | Script verifies nonempty `## What This Does Not Mean` (>40 chars) |',
              '',
              'If any row fails, comment with the missing evidence. Do not promote.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
