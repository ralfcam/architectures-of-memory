name: Extraction
description: Source-audit a claim into a draft evidence card, or register a remaining gap.
title: "[extraction] "
labels: ["extraction"]
body:
  - type: markdown
    attributes:
      value: |
        Default triage (until org-level Issue Fields exist): **Priority P2**, **Effort S**, **Card Status draft**.
        Do not overwrite `preliminary/drafts-chapters/`. Do not rewrite sleep, attachment-intervention, or screen-time theory without an explicit instruction in this issue.
  - type: input
    id: card_file
    attributes:
      label: Card filename
      description: Live file under evidence-cards/, or the filename you intend to add. Template is evidence-cards/_TEMPLATE.md.
      placeholder: infant-example.md
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Narrow claim
      description: The narrowest statement to extract or audit. Not a slogan.
    validations:
      required: true
  - type: dropdown
    id: chapter
    attributes:
      label: Chapter
      options:
        - Ch. 1
        - Ch. 2
        - Ch. 3
        - Ch. 4
        - Ch. 5
        - Ch. 6
        - Ch. 7
        - Ch. 8
        - Ch. 9
        - Ch. 10
        - Ch. 11
        - Ch. 12
        - Ch. 13
        - Ch. 14
        - Ch. 15
        - none / catalog only
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - prenatal
        - birth
        - regulation
        - cognition
        - language
        - social
        - executive
        - ecology
        - waypoint
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0-critical
        - P1-high
        - P2-medium
        - P3-low
      default: 2
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - XS
        - S
        - M
        - L
        - XL
      default: 1
    validations:
      required: true
  - type: input
    id: target_date
    attributes:
      label: Target date
      description: Optional ISO date (YYYY-MM-DD). Encodes the planned Issue Field until an org exists.
      placeholder: "2026-10-01"
  - type: textarea
    id: sources
    attributes:
      label: Candidate sources
      description: DOIs or persistent URLs. They must be registered in SOURCES.md in the same commit as any new card.
